[unix_http_server]
file=/tmp/supervisor.sock

[program:sl-sconcur-master]
command=php /app/artisan sconcur:servers:master:start
stdout_logfile=/var/log/supervisor/sl-sconcur-master-out.log
stderr_logfile=/var/log/supervisor/sl-sconcur-master-err.log
autostart=true
autorestart=true
startsecs=0
stopsignal=TERM
; The master forwards SIGTERM to its groups and waits out their shutdownTimeoutMs
; before killing them — up to 30 s for the task pool. Supervisor's own default here
; is 10 s, which would kill the master mid-drain and make every graceful stop below
; it pointless.
stopwaitsecs=40

