parameters:
  paths:
    - ../app/Modules
    - ../app/Models
    - ../app/Providers

  layers:
    - name: Domain
      collectors:
        - type: directory
          value: /app/Modules/\w+/Domain/(?!(Events|Exceptions|UseCases)/)
    - name: UseCases
      collectors:
        - type: directory
          value: /app/Modules/\w+/Domain/UseCases/
    - name: Events
      collectors:
        - type: directory
          value: /app/Modules/\w+/Domain/Events/
    - name: Exceptions
      collectors:
        - type: directory
          value: /app/Modules/\w+/Domain/Exceptions/
    - name: Entities
      collectors:
        - type: directory
          value: /app/Modules/\w+/Entities/
    - name: Parameters
      collectors:
        - type: directory
          value: /app/Modules/\w+/Parameters/
    - name: Transports
      collectors:
        - type: directory
          value: /app/Modules/\w+/Transports/
    - name: Repositories
      collectors:
        - type: directory
          value: /app/Modules/\w+/Repositories/
    - name: Enums
      collectors:
        - type: directory
          value: /app/Modules/\w+/Enums/
    - name: Helpers
      collectors:
        - type: directory
          value: /app/Modules/\w+/Helpers/
    - name: Providers
      collectors:
        - type: directory
          value: /app/Modules/\w+/Infrastructure/(Providers/|[^/]*Provider.php$)
    - name: Composition
      collectors:
        - type: directory
          value: /app/Providers/
        - type: directory
          value: /app/Modules/ModulesConfig.php$
    - name: Infrastructure
      collectors:
        - type: directory
          value: /app/Modules/\w+/Infrastructure/(?!(Providers/|[^/]*Provider.php$))
    - name: Models
      collectors:
        - type: directory
          value: /app/Models

  ruleset:
    Domain:
      - Transports
      - Entities
      - Parameters
      - Repositories
      - Enums
      - Helpers
      - Events
      - Exceptions
    UseCases:
      - Transports
      - Domain
      - Entities
      - Parameters
      - Enums
      - Helpers
      - Events
      - Exceptions
    Entities:
      - Enums
    Parameters:
      - Entities
      - Enums
    Enums: []
    Helpers: []
    Events:
      - Entities
      - Enums
    Exceptions:
      - Entities
      - Enums
    Transports:
      - Entities
      - Parameters
      - Enums
      - Repositories
    Repositories:
      - Transports
      - Entities
      - Parameters
      - Models
      - Enums
      - Helpers
      - Exceptions
    Infrastructure:
      - Domain
      - Parameters
      - Entities
      - UseCases
      - Enums
      - Helpers
      - Events
      - Exceptions
    Providers:
      - Transports
      - Domain
      - UseCases
      - Entities
      - Parameters
      - Repositories
      - Infrastructure
      - Enums
      - Helpers
      - Events
      - Exceptions
    Composition:
      - Providers
      - Infrastructure
      - Domain
      - Events
      - Exceptions
    Models: []
