deptrac:
  cache_file: code-analyse/deptrac/.deptrac-layers.cache

  paths:
    - ../../app/Modules
    - ../../app/Models

  analyser:
    types:
      - class
    internal_tag: internal

  layers:
    - name: Adapter
      collectors:
        - type: directory
          value: /app/Modules/\w+/Adapter/
    - name: Domain
      collectors:
        - type: directory
          value: /app/Modules/\w+/Domain/
    - name: Entities
      collectors:
        - type: directory
          value: /app/Modules/\w+/Entities/
    - name: Parameters
      collectors:
        - type: directory
          value: /app/Modules/\w+/Parameters/
    - name: Transports
      collectors:
        - type: directory
          value: /app/Modules/\w+/Transports/
    - name: Repositories
      collectors:
        - type: directory
          value: /app/Modules/\w+/Repositories/
    - name: Infrastructure
      collectors:
        # only dirs inside Infrastructure
        - type: directory
          value: /app/Modules/\w+/Infrastructure/\w+/
    - name: Models
      collectors:
        - type: directory
          value: /app/Models

  ruleset:
    Adapter:
      - Domain
      - Entities
      - Parameters
      - Transports
      - Repositories
    Domain:
      - Adapter
      - Entities
      - Parameters
      - Transports
      - Repositories
    Parameters:
      - Entities
    Transports:
      - Entities
      - Parameters
      - Repositories
    Repositories:
      - Entities
      - Parameters
      - Transports
      - Models
    Infrastructure:
      - Adapter
      - Domain
      - Parameters
      - Entities
    Models:
