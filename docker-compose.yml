services:
  nginx:
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-nginx
    restart: unless-stopped
    image: nginx:alpine
    depends_on:
      - workers
    environment:
      # substituted into docker/nginx/templates/default.conf.template on startup
      SCONCUR_HTTP_PORT: ${SCONCUR_HTTP_PORT:-28080}
      SCONCUR_WS_PORT: ${SCONCUR_WS_PORT:-28090}
    ports:
      - ${APP_PORT:-80}:80
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates
      - ./docker/nginx/entrypoint.d/10-logs-dir.sh:/docker-entrypoint.d/10-logs-dir.sh
      # read by the Logs page, see config/module-logs.php
      - ./storage/logs/nginx:/var/log/nginx/app

  php-fpm:
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-php-fpm
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php_app
      args:
        - APP_ENV=${APP_ENV}
        - GROUP_ID=${DOCKER_GROUP_ID}
        - USER_ID=${DOCKER_USER_ID}
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      mongo:
        condition: service_started
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      XDEBUG_CONFIG: "remote_host=${XDEBUG_REMOTE_HOST:-php-fpm} client_host=${XDEBUG_CLIENT_HOST:-host.docker.internal} remote_enable=1"
      PHP_IDE_CONFIG: "serverName=${PHP_IDE_CONFIG_SERVER_NAME}"
    volumes:
      - ./:/app
      - ./docker/php/conf/php.ini:/usr/local/etc/php/conf.d/docker.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"

  workers:
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-workers
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php_workers
      args:
        - GROUP_ID=${DOCKER_GROUP_ID}
        - USER_ID=${DOCKER_USER_ID}
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      mongo:
        condition: service_started
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      QUEUE_TRACES_CLEANER_CONNECTION: ${QUEUE_TRACES_CLEANER_CONNECTION:-redis}
      QUEUE_TRACES_CLEANER_NAME: ${QUEUE_TRACES_CLEANER_NAME:-traces-clearing}
      QUEUE_TRACE_TREE_CONNECTION: ${QUEUE_TRACE_TREE_CONNECTION:-redis}
      QUEUE_TRACE_TREE_NAME: ${QUEUE_TRACE_TREE_NAME:-trace-tree}
      QUEUE_TRACE_TREE_WORKERS_COUNT: ${QUEUE_TRACE_TREE_WORKERS_COUNT:-1}
    volumes:
      - ./:/app
      - ./docker/php/conf/php-workers.ini:/usr/local/etc/php/conf.d/docker.ini
      - ./docker/supervisor/conf/supervisor.conf:/etc/supervisor/conf.d/supervisord.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: supervisord -n

  receiver:
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-receiver
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/receiver/Dockerfile
      args:
        - GROUP_ID=${DOCKER_GROUP_ID}
        - USER_ID=${DOCKER_USER_ID}
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      clickhouse:
        condition: service_healthy
    ports:
      - ${RECIEVER_SOCKET_DOCKER_PORT:-10031}:${RECIEVER_SOCKET_PORT:-9030}
    volumes:
      - ./servers/receiver:/app
      - ./servers/receiver/.env:/app/.env
      - ./servers/receiver/storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: /app/bin/receiver

  mysql:
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-mysql
    restart: unless-stopped
    image: mysql:8.0
    ports:
      - ${DB_DOCKER_PORT:-3308}:${DB_PORT:-3306}
    environment:
      MYSQL_HOST: ${DB_HOST}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      SERVICE_NAME: mysql
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}" ]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-redis
    restart: unless-stopped
    image: redis:alpine
    ports:
      - ${REDIS_DOCKER_PORT:-6379}:${REDIS_PORT:-6379}
    volumes:
      - redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      retries: 3
      timeout: 5s

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-rabbitmq
    # Pins the node name. RabbitMQ calls its node rabbit@$(hostname) and keeps its
    # database under mnesia/rabbit@$(hostname); without this, Docker hands a recreated
    # container a fresh hostname, so the broker comes up as a brand new empty node and
    # the previous one's queues are simply left behind in the volume — which is how the
    # consumer pool ended up on 404 NOT_FOUND after a plain `make restart`.
    # It stays fixed whatever DOCKER_CONTAINER_PREFIX is: a hostname is local to the container.
    hostname: sl-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: rabbitmq-diagnostics -q check_running
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 60s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - ${RABBITMQ_DOCKER_PORT:-6672}:5672
      - ${RABBITMQ_DOCKER_ADMIN_PORT:-25672}:15672

  mongo:
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-mongo
    restart: unless-stopped
    image: mongo:8.0.5
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_WIRED_TIGER_CACHE_SIZE_GB:-5}", "--wiredTigerCollectionBlockCompressor", "zstd"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      MONGO_ADMIN_USERNAME: ${MONGO_ADMIN_USERNAME}
      MONGO_ADMIN_PASSWORD: ${MONGO_ADMIN_PASSWORD}
    ports:
      - ${MONGO_DOCKER_PORT}:${MONGO_PORT}
    volumes:
      - ./docker/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo:/data/db

  clickhouse:
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-clickhouse
    restart: unless-stopped
    image: clickhouse/clickhouse-server:26.8.14.3
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-slogger}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-slogger}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-6g}
    # php and the receiver reach it as clickhouse:8123; the published port is for a viewer on the host
    ports:
      - ${CLICKHOUSE_DOCKER_PORT:-18123}:8123
    volumes:
      # single files, not the directories: the image's entrypoint writes its own user
      # file into users.d when CLICKHOUSE_USER is set
      - ./docker/clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./docker/clickhouse/users.d/profile.xml:/etc/clickhouse-server/users.d/profile.xml:ro
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping" ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    container_name: ${DOCKER_CONTAINER_PREFIX:-sl}-frontend
    restart: unless-stopped
    image: node:22-alpine
    working_dir: /app
    ports:
      - ${FRONTEND_DOCKER_PORT}:3000
    volumes:
      - ./frontend:/app
      - ./storage/api/json-schemes/:/app/json-schemes
    command: [ "npm", "run", "${FRONTEND_DOCKER_COMMAND}" ]

volumes:
  mysql:
    driver: local
  redis:
    driver: local
  mongo:
    driver: local
  clickhouse:
    driver: local
  rabbitmq-data:
    driver: local
